packages:
  - 'workers/*'

overrides:
  # GHSA-9rgm-9g3h-6x36 (DoS via malformed input) is fixed in 5.9.1, and devalue is on the
  # production path: SvelteKit serialises server data through it. Pinned here rather than
  # left to resolution because nothing in the tree actually asks for a safe version —
  # @sveltejs/kit 2.70.3 still declares `^5.8.1`, and the patched 5.9.4 only wins because
  # svelte 5.57.2 happens to declare `^5.9.2` and pnpm dedupes the two. A svelte downgrade
  # would silently reopen the advisory with no warning and no lockfile conflict.
  #
  # `overrides` lives here, not under a `pnpm` key in package.json: pnpm 11 ignores that
  # field outright and only warns about it.
  devalue: '>=5.9.1'

allowBuilds:
  '@tailwindcss/oxide': true
  workerd: true
  sharp: true
  esbuild: true
  # Pulled in by @huggingface/transformers but never used: the embedding model runs in the
  # browser through onnxruntime-web. Declared false so the native build is skipped on
  # purpose rather than merely warned about on every install.
  onnxruntime-node: false
  protobufjs: false

patchedDependencies:
  # Makes ContentType's delete and gc walks and redoItem iterative, reads a plain value nested past
  # a fixed depth as null, stops a throw during cleanup wedging the document, files deep events in
  # linear time, drops structs of no length, reads only the sub-document options Yjs writes, and
  # collects an item whose neighbours are in different parents. Stock Yjs recurses once per nesting
  # level, so a few KB from a peer overflows the stack inside Y.applyUpdate, before any of this repo's
  # code runs. See the Data layer section of AGENTS.md. Redo it when bumping yjs: in src/lib/sync/,
  # deep-nesting.test.ts, deep-values.test.ts, deep-touch.test.ts, empty-structs.test.ts,
  # subdoc-options.test.ts and crossed-origins.test.ts fail without it.
  yjs@13.6.31: patches/yjs@13.6.31.patch
  # Adds `cancelScroll` to Virtualizer's handle, which stock virtua has inside but does not offer. A
  # scroll it was asked for keeps being corrected for 150 ms after the last row is measured, and a
  # person's own scroll inside that time was undone. See the UI section of AGENTS.md. Redo it when
  # bumping virtua: e2e/list-window.e2e.ts fails without it.
  virtua@0.51.0: patches/virtua@0.51.0.patch
