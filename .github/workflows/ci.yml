name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm # setup-node v6 auto-caches npm only; pnpm must be installed first (step above)

      - run: pnpm install --frozen-lockfile # `prepare` runs svelte-kit sync

      - name: Typecheck (wrangler types --check + svelte-check)
        run: pnpm check

      - name: Lint (prettier + eslint)
        run: pnpm lint

      # Needed by BOTH the Vitest browser-mode component tests and Playwright e2e
      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # Vendors the embedding model + ONNX runtime (scripts/fetch-search-assets.mjs) so
      # semantic search is fully self-hosted, in CI too — ADR 0006's "no test may download
      # the model" is exactly what this replaces: it's no longer a third-party fetch at
      # search time, only a one-time vendoring step, cached across runs by model version.
      # Must run before both the e2e step below (its webServer build copies `static/`) and
      # the standalone build step further down.
      - name: Cache self-hosted search assets
        uses: actions/cache@v4
        with:
          path: static/models
          key: search-model-Xenova-all-MiniLM-L6-v2-q8

      - name: Fetch self-hosted search assets (model + ONNX runtime)
        run: pnpm fetch:search-assets

      - name: Unit & component tests (Vitest)
        run: pnpm test:unit --run

      - name: E2E tests (Playwright; webServer = build + wrangler dev on :4173)
        run: pnpm exec playwright test

      - name: Build (adapter-cloudflare)
        run: pnpm build

      - name: Validate worker bundle (dry-run, no credentials)
        run: pnpm exec wrangler deploy --dry-run --outdir=.wrangler/dist

      # The relay is a separate worker with its own config and TypeScript program; the root
      # check and dry-run above never touch it, so a broken Durable Object would ship green.
      - name: Typecheck the relay worker
        run: pnpm --filter syncticket-relay run check

      - name: Validate relay bundle (dry-run, no credentials)
        run: pnpm --filter syncticket-relay run dry-run

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30
