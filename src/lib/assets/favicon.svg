<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <title>SyncTicket</title>
  <!--
    The same mark as shell/brand-mark.svelte. Two things differ, and only two.

    A favicon inherits no colour, so the ink is literal rather than currentColor: #0a0a0a and
    #fafafa are sRGB for this theme's own --foreground, oklch(0.145 0 0) and oklch(0.985 0 0).
    The media query is why both are here — browser chrome is the one surface this product cannot
    theme, so the mark reads the tab's and matches it. A browser that ignores the query gets the
    light ink, which is correct for the majority of tab bars.

    And the stroke is 2.6 rather than 2: at 16px a 2px stroke in a 24px box renders at 1.33px
    and goes spindly. 2.6 lands at ~1.7px, which holds. Every coordinate, the corner radius, the
    seam positions and the dot are identical to the component, so the tab and the sidebar are
    one mark rather than two drawings of one idea.
  -->
  <style>
    :root { color: #0a0a0a }
    @media (prefers-color-scheme: dark) { :root { color: #fafafa } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.4 4H8.5A4.5 4.5 0 0 0 4 8.5v7a4.5 4.5 0 0 0 4.5 4.5h0.9" />
    <path d="M14.6 4h0.9A4.5 4.5 0 0 1 20 8.5v7a4.5 4.5 0 0 1-4.5 4.5h-0.9" />
  </g>
  <circle cx="12" cy="12" r="2.7" fill="currentColor" />
</svg>
