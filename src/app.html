<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta
			name="description"
			content="A local-first issue tracker: edits merge both ways, even offline."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="SyncTicket" />
		<meta property="og:title" content="SyncTicket" />
		<meta
			property="og:description"
			content="A local-first issue tracker: edits merge both ways, even offline."
		/>
		<meta property="og:url" content="https://syncticket.elbaymalik.com/" />
		<meta property="og:image" content="https://syncticket.elbaymalik.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="SyncTicket: a screenshot of the app" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			// First of all: a page reached over plain HTTP goes to HTTPS before it reads or sends
			// anything. A workspace link carries its capability in `?ws=`, and over HTTP anyone on
			// the network path could read it, or answer with a page of their own. The zone's Always
			// Use HTTPS answers such a request with a redirect before any page is served, and the HSTS
			// header keeps a browser from asking over HTTP again; this is the fallback should that
			// setting ever be off, since there is no server of our own to redirect any more
			// (ADR 0011). Only the live host: every local and LAN server is plain HTTP on purpose.
			if (location.protocol === 'http:' && location.hostname === 'syncticket.elbaymalik.com') {
				location.replace('https:' + location.href.slice('http:'.length));
			}
		</script>
		<script>
			// Before any other script: a browser set to block site data throws on any read of
			// localStorage, and libraries the root layout imports (mode-watcher, and runed under it)
			// read it while their modules load. That threw before the app could start, and SvelteKit
			// replaced the page with a bare "500 Internal Error". With an in-memory stand-in the app
			// runs, and IndexedDB being refused too is what makes it say nothing is being saved.
			(function () {
				['localStorage', 'sessionStorage'].forEach(function (name) {
					try {
						if (window[name]) return;
					} catch (error) {
						// Blocked: replaced below.
					}
					var items = new Map();
					var storage = {
						get length() {
							return items.size;
						},
						key: function (index) {
							var keys = Array.from(items.keys());
							return index in keys ? keys[index] : null;
						},
						getItem: function (key) {
							return items.has(String(key)) ? items.get(String(key)) : null;
						},
						setItem: function (key, value) {
							items.set(String(key), String(value));
						},
						removeItem: function (key) {
							items.delete(String(key));
						},
						clear: function () {
							items.clear();
						}
					};
					try {
						Object.defineProperty(window, name, { value: storage, configurable: true });
					} catch (error) {
						// Nothing more to do: the app's own reads are guarded.
					}
				});
			})();
		</script>
		<script>
			// The colour scheme, before the first paint. A server render used to put mode-watcher's
			// own script here; with the page drawn in the browser (ADR 0011) it would only arrive
			// with the app, and a dark-mode visitor would see a white page until then. The same
			// logic and storage key as mode-watcher's `setInitialMode`, which takes over on mount.
			(function () {
				var mode = 'system';
				try {
					mode = localStorage.getItem('mode-watcher-mode') || 'system';
				} catch (error) {
					// Storage refused: follow the system.
				}
				var light =
					mode === 'light' ||
					(mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.classList.toggle('dark', !light);
				document.documentElement.style.colorScheme = light ? 'light' : 'dark';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
